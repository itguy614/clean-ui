name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every docs site resolves @itguy614/clean-ui to workspace *source* at
      # bundle time (config/workspace-aliases.ts), but type-checking it still
      # goes through the normal workspace:* symlink, which reads this
      # package's dist/index.d.ts — so it has to exist first.
      - name: Build library
        run: pnpm --filter @itguy614/clean-ui build

      # Builds every site listed in config/docs-sites.mjs with its own base
      # path and composes them into one directory for one Pages artifact —
      # Pages hosts one site per repository, so N docs apps become N
      # subdirectories (the first entry keeps this site's existing root URL).
      # Writes the single, site-root 404.html Pages actually serves for any
      # unmatched path anywhere on the site (see the script for why a
      # 404.html nested under a sub-site's own directory wouldn't work).
      - name: Build and compose docs sites
        env:
          VITE_BASE: /clean-ui/
        run: node scripts/build-docs-sites.mjs combined-dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
